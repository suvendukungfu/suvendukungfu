name: Generate Spider-Verse Profile Animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the cinematic Spider-Verse hero animation
        run: |
          mkdir -p dist
          python .github/scripts/generate_spiderverse_arena.py dist/spiderverse-arena.svg

      - name: Generate the real contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E62429&color_dots=%23e9f4ff,%2345a7ff,%230c5ce8,%23E62429,%23FBD000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FBD000&color_dots=%2310172b,%2345a7ff,%230c5ce8,%23E62429,%23FBD000

      - name: Render animated Spider-Verse effects over the contribution grid
        run: node .github/scripts/spiderverse-overlay.mjs dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg

      - name: Publish profile animations to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
