name: Generate Bird Battle Contribution Graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate the real contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E52521&color_dots=%23fff4cc,%23FBD000,%23FF9A3C,%23E52521,%23009B48
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FBD000&color_dots=%231f2937,%23FBD000,%23FF9A3C,%23E52521,%23009B48

      - name: Add the slingshot bird battle scene
        run: node .github/scripts/bird-battle-overlay.mjs dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg

      - name: Publish graph animations to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
